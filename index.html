<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">

    <title>Dr. Alex Baba | Northbridge Stantech Group</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #111111;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #1d1d1d;
            border-radius: 24px;
            padding: 36px 25px 28px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,.45);
        }

        /* PROFILE PHOTO */
        .profile-photo {
            width: 180px;
            height: 180px;
            object-fit: cover;

            /* Moves the visible area upward,
               allowing more of the head to show */
            object-position: center 25%;

            border-radius: 50%;
            display: block;
            margin: 0 auto 22px;

            border: 4px solid #c9a227;
            box-shadow: 0 8px 25px rgba(0,0,0,.35);
        }

        h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
        }

        .position {
            margin-top: 10px;
            color: #c9a227;
            font-size: 16px;
        }

        .company {
            margin-top: 7px;
            color: #cccccc;
            font-size: 14px;
        }

        .buttons {
            margin-top: 30px;
        }

        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 52px;
            margin: 12px 0;
            border-radius: 13px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .button:active {
            transform: scale(.97);
        }

        .save {
            background: #c9a227;
            color: #111111;
        }

        .secondary {
            background: #292929;
            color: #ffffff;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 13px;
            border-radius: 10px;
            background: #292929;
            color: #dddddd;
            font-size: 13px;
            line-height: 1.5;
        }

        .footer {
            margin-top: 25px;
            color: #777777;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="card">

    <!-- PROFILE PHOTO -->
    <img
        src="alex-baba.jpg"
        alt="Dr. Alex Baba"
        class="profile-photo"
    >

    <h1>Dr. Alex Baba</h1>

    <div class="position">
        Strategic Projects Adviser
    </div>

    <div class="company">
        Northbridge Stantech Group
    </div>

    <div class="buttons">

        <!-- SAVE CONTACT -->
        <button class="button save" id="saveContact">
            ＋&nbsp; SAVE CONTACT
        </button>

        <!-- CALL -->
        <a
            class="button secondary"
            href="tel:+2348037881337">
            ☎&nbsp; CALL
        </a>

        <!-- EMAIL -->
        <a
            class="button secondary"
            href="mailto:aebaba@northbridgestantech.com">
            ✉&nbsp; EMAIL
        </a>

        <!-- WEBSITE -->
        <a
            class="button secondary"
            href="https://northbridgestantech.com"
            target="_blank"
            rel="noopener">
            🌐&nbsp; WEBSITE
        </a>

    </div>

    <div id="message" class="message"></div>

    <div class="footer">
        Northbridge Stantech Group
    </div>

</div>

<script>

const saveButton = document.getElementById("saveContact");
const message = document.getElementById("message");

const vcard = `BEGIN:VCARD
VERSION:3.0
FN:Dr. Alex Baba
N:Baba;Alex;;Dr.;
ORG:Northbridge Stantech Group
TITLE:Strategic Projects Adviser
TEL;TYPE=CELL:+2348037881337
EMAIL:aebaba@northbridgestantech.com
URL:https://northbridgestantech.com
END:VCARD`;

saveButton.addEventListener("click", async function () {

    const file = new File(
        [vcard],
        "alex-baba.vcf",
        {
            type: "text/vcard"
        }
    );

    /* Try native phone sharing first */

    if (
        navigator.share &&
        navigator.canShare &&
        navigator.canShare({ files: [file] })
    ) {

        try {

            await navigator.share({
                files: [file],
                title: "Dr. Alex Baba",
                text: "Save Dr. Alex Baba to your contacts."
            });

            return;

        } catch (error) {

            if (error.name === "AbortError") {
                return;
            }
        }
    }

    /* Fallback */

    const blob = new Blob(
        [vcard],
        {
            type: "text/vcard;charset=utf-8"
        }
    );

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");

    link.href = url;
    link.download = "alex-baba.vcf";

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(url);

    message.style.display = "block";

    message.innerHTML =
        "Your contact file has been prepared. Open the downloaded file to add Dr. Alex Baba to your contacts.";
});

</script>

</body>
</html>
