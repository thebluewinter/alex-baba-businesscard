<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Alex Baba | Northbridge Stantech Group</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111111;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #1c1c1c;
            border-radius: 24px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        .logo {
            width: 85px;
            height: 85px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #c9a227;
            color: #111111;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
        }

        h1 {
            margin: 0;
            font-size: 27px;
        }

        .title {
            margin-top: 8px;
            color: #c9a227;
            font-size: 16px;
        }

        .company {
            margin-top: 6px;
            color: #cccccc;
            font-size: 14px;
        }

        .buttons {
            margin-top: 30px;
        }

        .button {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 12px 0;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
        }

        .save {
            background: #c9a227;
            color: #111111;
        }

        .call,
        .email,
        .website {
            background: #292929;
            color: #ffffff;
        }

        .footer {
            margin-top: 25px;
            color: #888888;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">AB</div>

    <h1>Dr. Alex Baba</h1>

    <div class="title">
        Strategic Projects Adviser
    </div>

    <div class="company">
        Northbridge Stantech Group
    </div>

    <div class="buttons">

        <a class="button save" href="alex-baba.vcf">
            ＋ SAVE CONTACT
        </a>

        <a class="button call" href="tel:+2348037881337">
            ☎ CALL
        </a>

        <a class="button email" href="mailto:aebaba@northbridgestantech.com">
            ✉ EMAIL
        </a>

        <a class="button website"
           href="https://northbridgestantech.com"
           target="_blank">
            🌐 WEBSITE
        </a>

    </div>

    <div class="footer">
        Northbridge Stantech Group
    </div>

</div>

</body>
</html>
